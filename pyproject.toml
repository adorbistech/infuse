[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infuse-ai"
version = "0.1.0"
description = "INFUSE — Execution Intelligence: Voltage regulator for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "INFUSE Open Source Community", email = "community@adorbistech.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0.0",
    "starlette>=0.28.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/adorbistech/infuse"
Repository = "https://github.com/adorbistech/infuse"
Documentation = "https://github.com/adorbistech/infuse/tree/main/docs"

[project.scripts]
infuse = "infuse.cli.main:main"
infuse-mcp = "infuse.mcp.main:main"
infuse-server = "infuse.deployment.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["infuse*"]

