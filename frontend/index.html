<!DOCTYPE html>
<html class="dark" data-theme="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>INFUSE — Execution Intelligence Console</title>
  
  <!-- Typography -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Hanken+Grotesk:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'surface': '#101419',
            'surface-dim': '#101419',
            'surface-bright': '#36393f',
            'surface-container-lowest': '#0a0e13',
            'surface-container-low': '#181c21',

            'surface-container-high': '#262a30',
            'surface-container-highest': '#31353b',
            'on-surface': '#e0e2ea',

            'inverse-surface': '#e0e2ea',
            'inverse-on-surface': '#2d3136',
            'outline': '#8c909f',
            'outline-variant': '#424754',
            'surface-tint': '#adc6ff',
            'primary': '#adc6ff',
            'on-primary': '#002e6a',

            'tertiary-container': '#df7412',
            'on-tertiary-container': '#461f00',
            'error': '#ffb4ab',

            'error-container': '#93000a',
            'on-error-container': '#ffdad6',
            'background': '#101419',
            'on-background': '#e0e2ea',

            'headline-sm': ['Hanken Grotesk', 'sans-serif'],
            'title-md': ['Hanken Grotesk', 'sans-serif'],

  <link rel="stylesheet" href="./src/styles/theme.css"/>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Rendered by InfuseApp -->
  </div>

  <!-- Entry Script -->
  <script type="module">
    import { InfuseApp } from './src/app.js';
    const root = document.getElementById('app');
    const app = new InfuseApp(root);
    app.init();
  </script>
</body>
</html>
